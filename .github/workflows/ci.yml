name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# TODO: Add git-secrets or detect-secrets scanning
# - name: Scan for secrets
#   run: pip install detect-secrets && detect-secrets scan --all-files

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SF_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"
      - run: pip install -e ".[dev]"
      - run: ruff check app/
      - run: pytest -v --tb=short
      - name: Security scan
        run: pip install bandit && bandit -r app/ -ll -q

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=critical
