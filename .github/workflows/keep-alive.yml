name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * *' # Daily at 8:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (real DB hit)
        run: |
          echo "=== Auth ping (forces DB query on auth.users) ==="
          auth_response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/auth/v1/token?grant_type=password" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"email":"keepalive@ping.local","password":"keepalive"}')
          echo "Auth response: $auth_response (400 expected — means DB was queried)"

          echo "=== Auth health check ==="
          health_response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Auth health response: $health_response"

          # Fail only if ALL endpoints are unreachable (000 = network error)
          if [ "$auth_response" = "000" ] && [ "$health_response" = "000" ]; then
            echo "::error::Supabase project appears completely unreachable"
            exit 1
          fi

          echo "Supabase project pinged successfully — DB activity registered"
