name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * *' # Daily at 8:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (real DB query via PostgREST RPC)
        run: |
          echo "=== Real DB query via PostgREST ==="
          db_response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keepalive" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "DB RPC response: $db_response"

          echo "=== Auth ping (backup) ==="
          auth_response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/auth/v1/token?grant_type=password" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"email":"keepalive@ping.local","password":"keepalive"}')
          echo "Auth response: $auth_response"

          if [ "$db_response" = "000" ] && [ "$auth_response" = "000" ]; then
            echo "::error::Supabase project appears completely unreachable"
            exit 1
          fi

          if [ "$db_response" != "200" ]; then
            echo "::warning::DB RPC returned $db_response — check that the keepalive function exists"
          fi

          echo "Supabase project pinged successfully — real DB activity registered"
