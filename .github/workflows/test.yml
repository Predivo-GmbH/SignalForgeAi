name: Critical Path Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  critical-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run critical path tests
        run: npx playwright test e2e/critical-path.spec.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Run auth flow tests
        run: npx playwright test e2e/auth-flows.spec.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Test the local dev server (started by Playwright webServer), NOT production.
          # Without this, auth-flows defaults to https://signalforgeai.predivo.ch and
          # races the concurrent "Deploy to Production" FTP upload on the same push —
          # hashed JS chunks get swapped mid-test, dynamic imports fail with
          # "Failed to fetch dynamically imported module" and random tests go red.
          # critical-path.spec.ts already navigates via baseURL (localhost:5173).
          BASE_URL: http://localhost:5173

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: critical-path-results
          path: frontend/playwright-report/
