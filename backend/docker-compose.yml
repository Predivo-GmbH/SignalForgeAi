services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: signalforge
      POSTGRES_PASSWORD: signalforge
      POSTGRES_DB: signalforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SF_DATABASE_URL: postgresql+asyncpg://signalforge:signalforge@db:5432/signalforge
      SF_REDIS_URL: redis://redis:6379/0
      SF_CELERY_BROKER_URL: redis://redis:6379/1
      SF_CELERY_RESULT_BACKEND: redis://redis:6379/2
      SF_DEBUG: "true"
      SF_ANTHROPIC_API_KEY: ${SF_ANTHROPIC_API_KEY:-}
      SF_ANTHROPIC_ADMIN_API_KEY: ${SF_ANTHROPIC_ADMIN_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests
      - ./alembic:/code/alembic
      - ../docs:/code/docs:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    env_file: .env
    environment:
      SF_DATABASE_URL: postgresql+asyncpg://signalforge:signalforge@db:5432/signalforge
      SF_REDIS_URL: redis://redis:6379/0
      SF_CELERY_BROKER_URL: redis://redis:6379/1
      SF_CELERY_RESULT_BACKEND: redis://redis:6379/2
      SF_DEBUG: "true"
      SF_ANTHROPIC_API_KEY: ${SF_ANTHROPIC_API_KEY:-}
      SF_AI_MAX_DAILY_API_CALLS: "1500"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/code/app
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4

  beat:
    build: .
    environment:
      SF_DATABASE_URL: postgresql+asyncpg://signalforge:signalforge@db:5432/signalforge
      SF_REDIS_URL: redis://redis:6379/0
      SF_CELERY_BROKER_URL: redis://redis:6379/1
      SF_CELERY_RESULT_BACKEND: redis://redis:6379/2
      SF_DEBUG: "true"
    depends_on:
      worker:
        condition: service_started
    volumes:
      - ./app:/code/app
    command: celery -A app.worker.celery_app beat --loglevel=info

volumes:
  pgdata:
  redisdata:
