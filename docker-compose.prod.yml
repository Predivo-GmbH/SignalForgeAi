# Production deployment for SignalForge
version: "3.8"

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: signalforge
      POSTGRES_USER: signalforge
      POSTGRES_PASSWORD: ${SF_DB_PASSWORD:-signalforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports exposed to host — only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    # No ports exposed to host — only accessible within Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.5'
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - backend/.env.prod
    ports:
      - "127.0.0.1:8000:8000"  # Only accessible via Caddy reverse proxy
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - backend/.env.prod
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.5'
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A app.worker.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    env_file:
      - backend/.env.prod
    depends_on:
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
