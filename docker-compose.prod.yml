# Production deployment for SignalForge
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    logging: *default-logging
    environment:
      POSTGRES_DB: signalforge
      POSTGRES_USER: signalforge
      POSTGRES_PASSWORD: ${SF_DB_PASSWORD:-signalforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports exposed to host — only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    logging: *default-logging
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${SF_REDIS_PASSWORD:-changeme}
    environment:
      SF_REDIS_PASSWORD: ${SF_REDIS_PASSWORD:-changeme}
    volumes:
      - redisdata:/data
    # No ports exposed to host — only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$SF_REDIS_PASSWORD redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.5'
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    logging: *default-logging
    env_file:
      - backend/.env.prod
    ports:
      - "127.0.0.1:8000:8000"  # Only accessible via Caddy reverse proxy
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    logging: *default-logging
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - backend/.env.prod
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.5'
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    logging: *default-logging
    command: celery -A app.worker.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    env_file:
      - backend/.env.prod
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
