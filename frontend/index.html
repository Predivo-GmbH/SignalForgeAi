    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">

    <meta name="description" content="SignalForgeAI — AI-powered trading signal generation and backtesting platform. Build, test, and deploy automated trading strategies with confidence." />
    <meta property="og:title" content="SignalForgeAI" />
    <meta property="og:description" content="SignalForgeAI — AI-powered trading signal generation and backtesting platform. Build, test, and deploy automated trading strategies with confidence." />

  </head>
  <body>
    <script>
      // Prevent theme flash: apply persisted theme class before React hydrates
      try {
        var raw = localStorage.getItem("sf-theme");
        if (raw) {
          var parsed = JSON.parse(raw);
          var theme = parsed && parsed.state && parsed.state.theme;
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } else {
          // Default to dark if no preference stored
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        // Fallback to dark theme on parse error
        document.documentElement.classList.add("dark");
      }
    </script>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:system-ui,sans-serif">
        <h1>JavaScript Required</h1>
        <p>SignalForgeAI requires JavaScript to run. Please enable it in your browser settings.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
